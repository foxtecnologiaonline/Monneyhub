# Infra de desenvolvimento local — Postgres e Redis, nada além disso.
# Não é o compose de produção: sem credencial real, sem volume gerenciado,
# sem rede exposta além do host. `docker compose up -d` e seguir o Setup
# do README.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monneyhub
    ports:
      - "5432:5432"
    volumes:
      - monneyhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  monneyhub_postgres_data:
